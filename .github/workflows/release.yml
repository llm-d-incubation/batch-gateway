# Release workflow: creates a GitHub Release on version tags (v*.*.*),
# builds multi-arch binaries (as .tar.gz to preserve execute bit), and publishes release notes.
# Docker images for the same tag are built by docker.yml.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-tag-on-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is reachable from main
        run: |
          git fetch origin main
          TAG_SHA="${GITHUB_SHA}"
          if ! git merge-base --is-ancestor "$TAG_SHA" "origin/main"; then
            echo "::error::Release tags must point to a commit on main (merged into origin/main before tagging)."
            exit 1
          fi

  build:
    name: Build binaries
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build apiserver (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o bin/batch-gateway-apiserver-linux-amd64 ./cmd/apiserver
      - name: Build apiserver (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o bin/batch-gateway-apiserver-linux-arm64 ./cmd/apiserver
      - name: Build processor (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o bin/batch-gateway-processor-linux-amd64 ./cmd/batch-processor
      - name: Build processor (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o bin/batch-gateway-processor-linux-arm64 ./cmd/batch-processor

      - name: Upload apiserver artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apiserver-binaries
          path: |
            bin/batch-gateway-apiserver-linux-amd64
            bin/batch-gateway-apiserver-linux-arm64
      - name: Upload processor artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processor-binaries
          path: |
            bin/batch-gateway-processor-linux-amd64
            bin/batch-gateway-processor-linux-arm64

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download apiserver artifacts
        uses: actions/download-artifact@v4
        with:
          name: apiserver-binaries
          path: dist/apiserver
      - name: Download processor artifacts
        uses: actions/download-artifact@v4
        with:
          name: processor-binaries
          path: dist/processor

      - name: Package binaries as tar.gz (preserves execute bit on extract)
        run: |
          mkdir -p release
          cp dist/apiserver/* dist/processor/* release/
          cd release
          for f in batch-gateway-*; do
            if [ -f "$f" ]; then
              chmod +x "$f"
              tar czf "${f}.tar.gz" "$f"
              rm -f "$f"
            fi
          done
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
