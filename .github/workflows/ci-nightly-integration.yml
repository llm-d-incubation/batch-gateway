name: Nightly Integration Tests

on:
  push:
    branches: [ci/nightly-integration-tests] # temporary — remove before merge
  schedule:
    - cron: '0 3 * * *' # Every day at 3:00 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  integration-tests:
    name: Integration Tests (Kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: go install sigs.k8s.io/kind@latest

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy dev environment
        run: make dev-deploy

      - name: Run integration tests
        run: make test-e2e

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const content = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/CODEOWNERS'
            });
            const text = Buffer.from(content.data.content, 'base64').toString();
            const owners = [...new Set(text.match(/@[\w-]+/g).map(h => h.slice(1)))];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly integration tests failed on ${new Date().toISOString().split('T')[0]}`,
              body: `[Run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci'],
              assignees: owners
            });

      - name: Cleanup
        if: always()
        run: make dev-rm-cluster
