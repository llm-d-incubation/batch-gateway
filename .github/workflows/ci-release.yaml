name: CI Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Get the commit SHA (short version)
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          # Get the current timestamp
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          # Determine the version and tag based on the event
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # For tag pushes, use the tag name as version
            VERSION="${{ github.ref_name }}"
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            # For main branch, use 'latest'
            VERSION="main-${COMMIT_SHA}"
            TAG="latest"
          else
            # For PRs and other branches, use 'dev'
            VERSION="dev-${COMMIT_SHA}"
            TAG="dev"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: default
          push: true
        env:
          REGISTRY: ghcr.io/llm-d-incubation
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}

      - name: Output image tags
        run: |
          echo "Images pushed:"
          echo "  - ghcr.io/llm-d-incubation/batch-gateway-apiserver:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ghcr.io/llm-d-incubation/batch-gateway-apiserver:${{ steps.meta.outputs.tag }}"
          echo "  - ghcr.io/llm-d-incubation/batch-gateway-processor:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ghcr.io/llm-d-incubation/batch-gateway-processor:${{ steps.meta.outputs.tag }}"
          echo "  - ghcr.io/llm-d-incubation/batch-gateway-gc:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ghcr.io/llm-d-incubation/batch-gateway-gc:${{ steps.meta.outputs.tag }}"

  helm:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Determine chart version
        id: chart
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Semver tag — use it directly as the chart version (strip leading 'v')
            CHART_VERSION="${{ github.ref_name }}"
            CHART_VERSION="${CHART_VERSION#v}"
            APP_VERSION="${{ github.ref_name }}"
          else
            # main branch
            CHART_VERSION="0.0.0-main-${COMMIT_SHA}"
            APP_VERSION="main-${COMMIT_SHA}"
          fi

          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

      - name: Package and push Helm chart
        run: |
          helm package charts/batch-gateway \
            --version "${{ steps.chart.outputs.chart_version }}" \
            --app-version "${{ steps.chart.outputs.app_version }}"
          helm push batch-gateway-${{ steps.chart.outputs.chart_version }}.tgz \
            oci://ghcr.io/llm-d-incubation/charts

      - name: Output chart reference
        run: |
          echo "Chart pushed:"
          echo "  - ghcr.io/llm-d-incubation/charts/batch-gateway:${{ steps.chart.outputs.chart_version }}"
