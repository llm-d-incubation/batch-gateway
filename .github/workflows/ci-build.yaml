# CI Build: builds and pushes container images to GHCR on every merge to main.
# Release images (version-tagged) are built by create-release.yml.

name: CI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            VERSION="main-${COMMIT_SHA}"
            TAG="latest"
          else
            VERSION="dev-${COMMIT_SHA}"
            TAG="dev"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: default
          push: true
        env:
          REGISTRY: ghcr.io/llm-d
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}

      - name: Output image tags
        run: |
          echo "Images pushed:"
          echo "  - ghcr.io/llm-d/batch-gateway-apiserver:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ghcr.io/llm-d/batch-gateway-apiserver:${{ steps.meta.outputs.tag }}"
          echo "  - ghcr.io/llm-d/batch-gateway-processor:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ghcr.io/llm-d/batch-gateway-processor:${{ steps.meta.outputs.tag }}"
          echo "  - ghcr.io/llm-d/batch-gateway-gc:${{ steps.meta.outputs.commit_sha }}"
          echo "  - ghcr.io/llm-d/batch-gateway-gc:${{ steps.meta.outputs.tag }}"
