{{- if .Values.processor.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "batch-gateway.processor.fullname" . }}
  labels:
    {{- include "batch-gateway.processor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "batch-gateway.processor.selectorLabels" . | nindent 4 }}
{{- end }}
